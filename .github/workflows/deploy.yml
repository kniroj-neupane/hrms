name: Build and Deploy Next.js to VPS (HRMS)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to private Docker registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login registry2.siddharthahospitality.com \
            -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - name: Build and push Docker image
        run: |
          docker pull registry2.siddharthahospitality.com/hrms:latest || true

          docker build \
            --cache-from registry2.siddharthahospitality.com/hrms:latest \
            --build-arg NEXT_PUBLIC_APP_URL="${{ secrets.PROD_NEXT_PUBLIC_APP_URL }}" \
            --build-arg NEXT_PUBLIC_BETTER_AUTH_URL="${{ secrets.PROD_NEXT_PUBLIC_BETTER_AUTH_URL }}" \
            --build-arg BETTER_AUTH_URL="${{ secrets.PROD_BETTER_AUTH_URL }}" \
            --build-arg NEXT_PUBLIC_R2_ENDPOINT_URL="${{ secrets.PROD_NEXT_PUBLIC_R2_ENDPOINT_URL }}" \
            --build-arg NEXT_PUBLIC_R2_BUCKET_NAME="${{ secrets.PROD_NEXT_PUBLIC_R2_BUCKET_NAME }}" \
            --build-arg NEXT_PUBLIC_R2_PUBLIC_URL="${{ secrets.PROD_NEXT_PUBLIC_R2_PUBLIC_URL }}" \
            --build-arg NEXT_PUBLIC_C15T_URL="${{ secrets.PROD_NEXT_PUBLIC_C15T_URL }}" \
            -t registry2.siddharthahospitality.com/hrms:${{ github.sha }} \
            .

          docker push registry2.siddharthahospitality.com/hrms:${{ github.sha }}

          docker tag registry2.siddharthahospitality.com/hrms:${{ github.sha }} \
            registry2.siddharthahospitality.com/hrms:latest
          docker push registry2.siddharthahospitality.com/hrms:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH to VPS and deploy
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            set -e

            mkdir -p /root/envs

            cat > /root/envs/hrms.env <<EOF
            NODE_ENV=production
            PORT=3000
            HOSTNAME=0.0.0.0
            DATABASE_URL=${{ secrets.PROD_DATABASE_URL }}
            BETTER_AUTH_SECRET=${{ secrets.PROD_BETTER_AUTH_SECRET }}
            BETTER_AUTH_URL=${{ secrets.PROD_BETTER_AUTH_URL }}
            NEXT_PUBLIC_BETTER_AUTH_URL=${{ secrets.PROD_NEXT_PUBLIC_BETTER_AUTH_URL }}
            NEXT_PUBLIC_APP_URL=${{ secrets.PROD_NEXT_PUBLIC_APP_URL }}
            RESEND_API_KEY=${{ secrets.PROD_RESEND_API_KEY }}
            EMAIL_FROM=${{ secrets.PROD_EMAIL_FROM }}
            EMAIL_VERIFICATION_CALLBACK_URL=${{ secrets.PROD_EMAIL_VERIFICATION_CALLBACK_URL }}
            ORGANIZATION_INVITATION_CALLBACK_URL=${{ secrets.PROD_ORGANIZATION_INVITATION_CALLBACK_URL }}
            NEXT_PUBLIC_R2_ENDPOINT_URL=${{ secrets.PROD_NEXT_PUBLIC_R2_ENDPOINT_URL }}
            R2_ACCESS_KEY_ID=${{ secrets.PROD_R2_ACCESS_KEY_ID }}
            R2_SECRET_ACCESS_KEY=${{ secrets.PROD_R2_SECRET_ACCESS_KEY }}
            NEXT_PUBLIC_R2_BUCKET_NAME=${{ secrets.PROD_NEXT_PUBLIC_R2_BUCKET_NAME }}
            NEXT_PUBLIC_R2_PUBLIC_URL=${{ secrets.PROD_NEXT_PUBLIC_R2_PUBLIC_URL }}
            UPSTASH_REDIS_REST_URL=${{ secrets.PROD_UPSTASH_REDIS_REST_URL }}
            UPSTASH_REDIS_REST_TOKEN=${{ secrets.PROD_UPSTASH_REDIS_REST_TOKEN }}
            GROQ_API_KEY=${{ secrets.PROD_GROQ_API_KEY }}
            OPENAI_API_KEY=${{ secrets.PROD_OPENAI_API_KEY }}
            PINECONE_API_KEY=${{ secrets.PROD_PINECONE_API_KEY }}
            PINECONE_INDEX=${{ secrets.PROD_PINECONE_INDEX }}
            NEXT_PUBLIC_C15T_URL=${{ secrets.PROD_NEXT_PUBLIC_C15T_URL }}
            EOF

            # Strip leading spaces YAML may leave in the env file
            sed -i 's/^[[:space:]]*//' /root/envs/hrms.env

            HRMS_IMAGE=registry2.siddharthahospitality.com/hrms:${{ github.sha }}

            docker login registry2.siddharthahospitality.com \
              -u "${{ secrets.REGISTRY_USERNAME }}" \
              -p "${{ secrets.REGISTRY_PASSWORD }}"

            docker pull "$HRMS_IMAGE"

            docker stop hrms 2>/dev/null || true
            docker rm hrms 2>/dev/null || true

            # Explicit publish — do not rely on compose/SCP for ports
            docker run -d \
              --name hrms \
              --restart unless-stopped \
              --network postgres_default \
              --env-file /root/envs/hrms.env \
              -p 3050:3000 \
              "$HRMS_IMAGE"

            sleep 5
            echo "=== container status ==="
            docker ps -a --filter name=^hrms$ --format "table {{.Names}}\t{{.Image}}\t{{.Ports}}\t{{.Status}}"
            echo "=== last logs ==="
            docker logs --tail 50 hrms || true

            # Fail the job if port was not published
            docker port hrms 3000 | grep -q 3050

            # Keep last 2 images for rollback
            docker images --format "{{.Repository}} {{.Tag}} {{.ID}}" \
              | grep "registry2.siddharthahospitality.com/hrms" \
              | awk '{print $3}' \
              | tail -n +4 \
              | xargs -r docker rmi -f || true
            docker image prune -f || true
